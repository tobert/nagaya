[package]
name = "nagaya-family-beatthis"
version = "0.1.0"
edition = "2024"

[dependencies]
# The reader of a WAV request part. Pure Rust; the family takes 22,050 Hz mono only.
hound = "3.5.1"
# cos, sin, log, exp and log1p of the log-mel in pure Rust, so its bits do not depend on the libm of the machine.
libm = "0.2.16"
# The hash of the canary (spec 8.1).
sha2 = "0.10.9"
# The reader of a converted checkpoint.
safetensors = "0.8.0"
# The hyper_parameters of a converted checkpoint are JSON in its safetensors metadata.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
blake3 = "1.8.5"
