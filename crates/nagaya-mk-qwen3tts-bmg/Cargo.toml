[package]
name = "nagaya-mk-qwen3tts-bmg"
version = "0.1.0"
edition = "2024"

# The feature `xe` loads the engine on a B70 card. With no feature, the crate plans with no card.
[features]
xe = ["nagaya-mk-bmg/xe"]

[dependencies]
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
# The interpreter of the B70 megakernels, which this engine shares with the Gemma 4 engine.
nagaya-mk-bmg = { version = "0.1.0", path = "../nagaya-mk-bmg" }
blake3 = "1.8.2"
serde_json = "1.0.154"
sha2 = "0.10.9"

[dev-dependencies]
nagaya-conformance = { version = "0.1.0", path = "../nagaya-conformance" }
nagaya-family-qwen3tts = { version = "0.1.0", path = "../nagaya-family-qwen3tts" }
