[package]
name = "nagaya-mk-gemma4-bmg"
version = "0.1.0"
edition = "2024"

# The feature `xe` builds the kernels with `ocloc` and links Level Zero. With no feature, the crate needs no card.
[features]
xe = ["nagaya-mk-bmg/xe"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# The first Gemma 4 engine built serde_json with `preserve_order`. Turn on `float_roundtrip` too (spec 11.3a).
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10.9"
blake3 = "1.8.7"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
# The interpreter of the B70 megakernels, which this engine shares with the speech engine.
nagaya-mk-bmg = { version = "0.1.0", path = "../nagaya-mk-bmg" }
# The identity holds the template of the family library and its tokenizer hash (spec 11.3, 12.1).
nagaya-text-gemma4 = { version = "0.1.0", path = "../nagaya-text-gemma4" }

[dev-dependencies]
nagaya-conformance = { version = "0.1.0", path = "../nagaya-conformance" }
nagaya-store = { version = "0.1.0", path = "../nagaya-store" }
tempfile = "3"
