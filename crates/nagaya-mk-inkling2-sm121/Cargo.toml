[package]
name = "nagaya-mk-inkling2-sm121"
version = "0.1.0"
edition = "2024"

# The feature `cuda` enables the compiled `sm_121a` cubin and CUDA Driver API runtime.
# With no feature, the quantized host oracle and spec build and test with no GPU.
[features]
cuda = ["nagaya-mk-cuda/cuda", "dep:blake3"]

[dependencies]
blake3 = { version = "1.8.7", optional = true }
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
nagaya-mk-cuda = { version = "0.1.0", path = "../nagaya-mk-cuda" }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
# The host forms of the B70 crate are the oracle of the dense ops. With no feature it builds with no Level Zero.
nagaya-mk-inkling2-bmg = { version = "0.1.0", path = "../nagaya-mk-inkling2-bmg" }
