[package]
name = "nagaya-mk-inkling2-bmg"
version = "0.1.0"
edition = "2024"

# The feature `xe` builds the kernels of the card and links Level Zero. With no feature, the crate needs no card.
[features]
xe = ["nagaya-mk-bmg/xe"]

[dependencies]
# The host spec gives the limits and the part rules in the types of the ABI.
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
# The host form reads the checkpoint through the safetensors reader of the B70 interpreter. It needs no card.
nagaya-mk-bmg = { version = "0.1.0", path = "../nagaya-mk-bmg" }
rayon = "1.12.0"
# The host spec reads config.json.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
