[package]
name = "nagaya"
version = "0.1.0"
edition = "2024"

[features]
# The fake engine is for tests only. A normal build leaves it out (AGENTS.md "Milestones" 10).
fake = ["nagaya-abi/fake", "dep:nagaya-text-toy"]
# The mk engine on the GPU. A normal build leaves it out, so a machine without mk builds and tests the workspace.
# The Qwen-Image engine on the same GPU (milestone 22). Its config parse, plan and family build with no feature.
hip = [
    "dep:nagaya-mk-qwen38-gfx1151",
    "nagaya-mk-qwen38-gfx1151/hip",
    "dep:nagaya-text-qwen38",
    "nagaya-mk-qwenimage21-gfx1151/hip",
]
# The B70 engines: Gemma 4 on two cards, and Qwen3-TTS, SDXL, EmbeddingGemma 2 and LFM3 on one each. The config parse and
# the family libraries build with no feature.
xe = [
    "nagaya-mk-gemma4-bmg/xe",
    "nagaya-mk-qwen3tts-bmg/xe",
    "nagaya-mk-sdxl-bmg/xe",
    "nagaya-mk-embeddinggemma2-bmg/xe",
    "nagaya-mk-lfm3-bmg/xe",
]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
blake3 = "1.8.7"
chitchat = "0.13.0"
gogi-proto.workspace = true
http-body-util = "0.1.5"
# The cluster call to peers (spec 11.1a). Both crates are in the tree already, through axum and tonic.
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
nagaya-council = { version = "0.1.0", path = "../nagaya-council" }
nagaya-ledger = { version = "0.1.0", path = "../nagaya-ledger" }
nagaya-mk-gemma4-bmg = { version = "0.1.0", path = "../nagaya-mk-gemma4-bmg" }
nagaya-text-gemma4 = { version = "0.1.0", path = "../nagaya-text-gemma4" }
nagaya-mk-qwen3tts-bmg = { version = "0.1.0", path = "../nagaya-mk-qwen3tts-bmg" }
nagaya-text-qwen3tts = { version = "0.1.0", path = "../nagaya-text-qwen3tts" }
nagaya-mk-sdxl-bmg = { version = "0.1.0", path = "../nagaya-mk-sdxl-bmg" }
nagaya-text-sdxl = { version = "0.1.0", path = "../nagaya-text-sdxl" }
nagaya-mk-qwenimage21-gfx1151 = { version = "0.1.0", path = "../nagaya-mk-qwenimage21-gfx1151" }
nagaya-text-qwenimage21 = { version = "0.1.0", path = "../nagaya-text-qwenimage21" }
nagaya-mk-embeddinggemma2-bmg = { version = "0.1.0", path = "../nagaya-mk-embeddinggemma2-bmg" }
nagaya-text-embeddinggemma2 = { version = "0.1.0", path = "../nagaya-text-embeddinggemma2" }
nagaya-mk-lfm3-bmg = { version = "0.1.0", path = "../nagaya-mk-lfm3-bmg" }
nagaya-text-lfm3 = { version = "0.1.0", path = "../nagaya-text-lfm3" }
nagaya-mk-qwen38-gfx1151 = { version = "0.1.0", path = "../nagaya-mk-qwen38-gfx1151", optional = true }
nagaya-text-qwen38 = { version = "0.1.0", path = "../nagaya-text-qwen38", optional = true }
nagaya-text-toy = { version = "0.1.0", path = "../nagaya-text-toy", optional = true }
nagaya-sched = { version = "0.1.0", path = "../nagaya-sched" }
nagaya-store = { version = "0.1.0", path = "../nagaya-store" }
libc = "0.2.191"
nagaya-telemetry = { version = "0.1.0", path = "../nagaya-telemetry", features = ["export"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "net", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
futures-util = { version = "0.3.34", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
png = "0.18"

[dev-dependencies]
gogi-conformance.workspace = true
gogi-fake.workspace = true
gogi-toy.workspace = true
nagaya-text-toy = { path = "../nagaya-text-toy" }
# The Qwen3.8 tests of the text routes and of the job path read the tokenizer and the template of the GGUF file.
nagaya-text-qwen38 = { path = "../nagaya-text-qwen38" }
# The tests turn on the `fake` feature of this crate. A dev-dependency on the crate itself does this.
nagaya = { path = ".", features = ["fake"] }
tempfile = "3"
nagaya-store = { path = "../nagaya-store", features = ["testing"] }
nagaya-telemetry = { path = "../nagaya-telemetry", features = ["testing"] }
opentelemetry = "0.31.0"
