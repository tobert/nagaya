[package]
name = "nagaya"
version = "0.1.0"
edition = "2024"

[features]
# The fake engine is for tests only. A normal build leaves it out (AGENTS.md "Milestones" 10).
fake = ["nagaya-abi/fake"]

[dependencies]
blake3 = "1.8.7"
chitchat = "0.13.0"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
nagaya-ledger = { version = "0.1.0", path = "../nagaya-ledger" }
nagaya-store = { version = "0.1.0", path = "../nagaya-store" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync"] }
toml = "1.1.8"

[dev-dependencies]
# The tests turn on the `fake` feature of this crate. A dev-dependency on the crate itself does this.
nagaya = { path = ".", features = ["fake"] }
tempfile = "3"
nagaya-store = { path = "../nagaya-store", features = ["testing"] }
