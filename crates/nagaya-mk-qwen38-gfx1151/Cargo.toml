[package]
name = "nagaya-mk-qwen38-gfx1151"
version = "0.1.0"
edition = "2024"

[features]
# Build the Qwen3.8 engine from `hip/` with ROCm, and link it statically. A build without it needs no ROCm.
hip = []

[[example]]
name = "pass_scratch"
required-features = ["hip"]

[[example]]
name = "context_pool"
required-features = ["hip"]

[[example]]
name = "split_bits"
required-features = ["hip"]

[[example]]
name = "arena_digest"
required-features = ["hip"]

[[example]]
name = "thread_masks"
required-features = ["hip"]

[[bench]]
name = "oracle"
harness = false
required-features = ["hip"]

[[test]]
name = "ops"
required-features = ["hip"]

[dependencies]
libc = "0.2.191"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
nagaya-text-qwen38 = { version = "0.1.0", path = "../nagaya-text-qwen38" }
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
libloading = "0.8"
nagaya-conformance = { version = "0.1.0", path = "../nagaya-conformance" }
nagaya-sched = { version = "0.1.0", path = "../nagaya-sched" }
nagaya-store = { version = "0.1.0", path = "../nagaya-store" }
serde_json = "1.0.154"
tempfile = "3"

[[test]]
name = "hip_close"
required-features = ["hip"]
