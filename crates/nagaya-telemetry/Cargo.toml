[package]
name = "nagaya-telemetry"
version = "0.1.0"
edition = "2024"

[features]
# The setup of the process: the SDK, the OTLP exporters and the stderr log. Library crates leave it off.
export = [
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:tokio",
]
# In-memory exporters, so that a test reads what a call site recorded.
testing = ["export", "opentelemetry_sdk/testing"]

[dependencies]
opentelemetry = "0.31.0"
tracing = "0.1.44"
opentelemetry_sdk = { version = "0.31.0", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.1", optional = true, default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.31.1", optional = true }
tracing-opentelemetry = { version = "0.32.1", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter", "registry", "fmt"] }
tokio = { version = "1.53.1", optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
nagaya-telemetry = { path = ".", features = ["testing"] }
