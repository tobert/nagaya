[package]
name = "nagaya-store"
version = "0.1.0"
edition = "2024"

[features]
# The constructors with no tier budget are for tests only. A normal build leaves them out (spec 4.1a).
testing = []

[dependencies]
blake3 = "1.8.7"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The tests turn on the `testing` feature of this crate. A dev-dependency on the crate itself does this.
nagaya-store = { path = ".", features = ["testing"] }
nagaya-abi = { path = "../nagaya-abi", features = ["fake"] }
serde_json = "1.0"
tempfile = "3.27.0"
