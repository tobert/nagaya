[package]
name = "nagaya-mk-qwenimage21-gfx1151"
version = "0.1.0"
edition = "2024"

[features]
# Build the ops of nagaya-mk-hip with ROCm, and run the engine on gfx1151. A build without it needs no ROCm.
hip = ["nagaya-mk-hip/hip"]

[[test]]
name = "hip_encoder"
required-features = ["hip"]

[dependencies]
blake3 = "1.8.2"
nagaya-abi = { version = "0.1.0", path = "../nagaya-abi" }
nagaya-mk-hip = { version = "0.1.0", path = "../nagaya-mk-hip" }
serde_json = "1.0.154"
sha2 = "0.10.9"
toml = "1.1.8"

[dev-dependencies]
nagaya-conformance = { version = "0.1.0", path = "../nagaya-conformance" }
nagaya-mk-sdxl-bmg = { version = "0.1.0", path = "../nagaya-mk-sdxl-bmg" }
tempfile = "3"

[[test]]
name = "hip_transformer"
required-features = ["hip"]

[[test]]
name = "hip_vae"
required-features = ["hip"]

[[test]]
name = "hip_engine"
required-features = ["hip"]

[[example]]
name = "measure"
required-features = ["hip"]
