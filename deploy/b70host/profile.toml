# The placement profile of b70host (docs/spec.md 2.4). The nagaya reads the accepted profile from
# `<store_dir>/profile.toml`, so docs/deploy.md says to copy this file there once. The loader is
# `crates/nagaya/src/profile.rs`, and `crates/nagaya/tests/deploy.rs` reads this file.

# The Gemma 4 engine on the two B70 cards (docs/engine-abi.md "How mkviolet maps"). Machine devices 0 and 1 are the
# cards at 0000:03:00.0 and 0000:08:00.0; device 2 is the ignored iGPU (spec 2.1). Stage 0 runs on device 0, and
# stage 1 on device 1. The checkpoint directory comes from the unit's environment (`GEMMA4_MODEL_DIR`), and not from
# this table, as the shards of mk do on gfx1151host.
[[engines]]
name = "gemma"
kind = "mk-gemma4-bmg"
devices = [0, 1]
share = 1
pin_identity = false

# The slots that mkviolet serves (mkviolet `src/main.rs`: `MAX_SEQ`, `GEN_SEQ`): one of 4,096 positions and one of
# 65,536. The block is mkviolet's `MAX_BLOCK`, 512 tokens, and the engine's default.
[engines.config]
slots = [4096, 65536]
max_block = 512

# The Qwen3-TTS VoiceDesign engine on card 0 (milestone 17, docs/spec.md 11.8). It is on demand: a load route or a
# profile `PUT` loads it (spec 3.3, 3.3b), and it unloads after 60 s with no job (spec 3.3a). Its plan gives 5,645,096,644 bytes on its card:
# 4,321,971,520 of weights, 1,223,336,064 for two slots, and 99,789,060 of work. Card 0 has 4,394,792,436 bytes beside
# gemma, so its load unloads gemma, and gemma loads again when the speech engine goes idle. The checkpoint
# comes from the unit's environment (`QWEN3TTS_MODEL_DIR`).
[[engines]]
name = "voice"
kind = "qwen3tts-bmg"
devices = [0]
share = 1
pin_identity = false
residency = "on_demand"

# Two requests at once, each of at most 1,500 frames (120 s of audio) after a prompt of at most 512 positions. One
# quantum makes at most 8 frames (640 ms of audio).
[engines.config]
slots = 2
max_frames = 1500
max_prompt = 512
frames_per_quantum = 8

# An SDXL base 1.0 engine on each card (milestone 18, docs/spec.md 11.9). Each one is its own served image model, with
# the name of its engine. Each plans 21,018,307,972 bytes: 14,243,390,464 on its card for the weights and their BF16
# planes, 6,707,675,524 on its card for the activations of 4 images of 1.5 MP, and 67,241,984 of host memory. Thus
# neither one loads beside gemma, and a load unloads gemma. The two load together, and the speech engine fits beside
# sdxl-0. An engine unloads after 600 s with no job, so a session of image requests keeps it. The checkpoint comes from
# the unit's environment (`SDXL_MODEL_DIR`), and `clip_skip` is 1, the default of the family.
[[engines]]
name = "sdxl-0"
kind = "mk-sdxl-bmg"
devices = [0]
share = 1
pin_identity = false
residency = "on_demand"
idle_unload_s = 600

[[engines]]
name = "sdxl-1"
kind = "mk-sdxl-bmg"
devices = [1]
share = 1
pin_identity = false
residency = "on_demand"
idle_unload_s = 600

# One budget for each card's device memory, and one for host memory (spec 4.1). Each B70 has 32 GiB of GDDR6
# (BAR 2 of `resource`, spec 2.1). The budget of a card is all of it: the device has no safety floor. The plan of
# this profile gives 29,964,945,932 bytes of mandatory terms on device 0 and 31,889,794,060 on device 1, and
# 1,515,343,872 in host memory (`crates/nagaya/tests/deploy.rs`, 2026-10-21). Card 1 has about 2.3 GB left.
[[budgets]]
tiers = ["device(0)"]
bytes = 34359738368

[[budgets]]
tiers = ["device(1)"]
bytes = 34359738368

# The host has 129,447,428 kB (about 123.5 GiB, `proc/meminfo` of 2026-10-21), and the safety floor of spec 4.7 is
# 12 GiB. The host budget takes 96 GiB = 103,079,215,104 bytes, which leaves about 15.5 GiB above the floor.
[[budgets]]
tiers = ["host"]
bytes = 103079215104

# The store (spec 4.1a): 16 GiB in host memory and 50 GiB on NVMe, as on gfx1151host. The host budget of the store takes
# its bytes from the host budget above. Objects have their own budget of 200 GiB on the same disk, apart from the
# NVMe budget (spec 6.15, Amy 2026-10-25): objects of up to 8 GiB, and keeps of up to 100 GiB in all.
[store]
nvme = 53687091200
host = 17179869184
interval_copies = 0
objects = 214748364800
