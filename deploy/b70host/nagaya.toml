# The bootstrap config of the nagaya on b70host (docs/spec.md 2.1, 11.6). The unit
# `deploy/b70host/nagaya.service` points NAGAYA_CONFIG at this file. The loader (`crates/nagaya/src/bootstrap.rs`)
# refuses an unknown key. `crates/nagaya/tests/deploy.rs` reads this file.

# The HTTP address on the tailnet.
http_bind = "198.51.100.10:8091"

# The gossip address: a UDP port on the same tailnet address, next to the HTTP port (spec 2.3). No socket used 8092 on
# 2026-10-21 (`ss -lntu`). The loader refuses 0.0.0.0, because no peer can reach it.
gossip_bind = "198.51.100.10:8092"

# The store directory. It holds the accepted profile (`profile.toml`), its version and the store's NVMe tier. It is
# under the XDG data directory, on the 4 TB NVMe disk of b70host. The loader does not expand `~`, so the path is
# absolute.
store_dir = "/home/atobey/.local/share/nagaya/store"

# gfx1151host and b70host form one cluster (milestone 23). The seed is the gossip address of gfx1151host (spec 2.1).
seed_peers = ["198.51.100.20:8091"]

# The time budget of the stop park, in seconds (spec 10.3). This is the default, and it is written here on purpose.
park_budget_secs = 10

# The Radeon 610M iGPU drives the display (spec 2.1, "Ignored devices"). It stays visible, and it gets no work.
ignore_devices = ["0000:80:00.0"]
