# The placement profile of gfx1151host (docs/spec.md 2.4). The nagaya reads the accepted profile from
# `<store_dir>/profile.toml`, so docs/deploy.md says to copy this file there once. The loader is
# `crates/nagaya/src/profile.rs`, and `crates/nagaya/tests/deploy.rs` reads this file.

# The mk engine (docs/engine-abi.md "v0 mk binding choices"). Its library and its shards come from the unit's
# environment (`MK_ENGINE_LIB`, `MK_SHARDS`), and not from this table. The context pool is fixed in the binding
# (`spec.rs`: `CONTEXT_COUNT`, `CONTEXT_CAPACITY`), so this profile names no context count and no context size.
[[engines]]
name = "mk"
kind = "mk-qwen38-gfx1151"
devices = [0]
share = 1
pin_identity = false

# `weights_bytes` is the size of mk's weight arena. mk knows it only after the weights load, and the plan reads no
# weights (spec 2.4). The value below is an ESTIMATE: 61 GiB, from mk's notes (`probes/RESULTS-2026-09-26.md`). The
# first start loads the weights, finds another size, and exits 3 with the real size in its message. Write that size
# here and in the copy in the store directory (docs/deploy.md, "The weights size").
[engines.config]
weights_bytes = 65498251264

# gfx1151host has one pool for device(0) and host (spec 4.1): the unified memory.
# 112 GiB = 120,259,084,288 bytes. The host has 131,156,408 kB (about 125.1 GiB, `proc/meminfo`), and the safety
# floor of spec 4.7 is 12 GiB. That leaves 113.1 GiB. The pool takes 112 GiB: a whole count of GiB, a little less.
[[budgets]]
tiers = ["device(0)", "host"]
bytes = 120259084288

# The store (spec 4.1a). Both sizes are mk's defaults for its parked contexts (mk `service/__main__.py`):
# 16 GiB in host memory, and 50 GiB on NVMe. The host budget takes its bytes from the pool above.
[store]
nvme = 53687091200
host = 17179869184
interval_copies = 0
