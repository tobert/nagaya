# The placement profile of the Strix Halo example (docs/spec.md 2.4): one gfx1151 GPU with 128 GB of unified memory.
# The nagaya reads the accepted profile from `<store_dir>/profile.toml`, so copy this file there once
# (docs/deploy.md). The loader is `crates/nagaya/src/profile.rs`, and `crates/nagaya/tests/deploy.rs` reads this file.

# The Qwen3.8 engine (docs/engine-abi.md "v0 binding choices"). The binary links it. Its shards come from the unit's
# environment (`QWEN38_SHARDS`), and not from this table. The context pool is fixed in the binding (`spec.rs`:
# `CONTEXT_COUNT`, `CONTEXT_CAPACITY`), so this profile names no context count and no context size. The engine is on
# demand: Qwen-Image stays loaded, and the Qwen3.8 engine swaps in through the load route,
# `POST /nagaya/v1/engines/qwen38/load` with `{"unload": ["qwen-image-fusal"]}` (spec 3.3b). Both can be loaded on
# purpose, the Qwen3.8 engine first, but a build beside both can stop it (docs/deploy.md).
[[engines]]
name = "qwen38"
kind = "mk-qwen38-gfx1151"
devices = [0]
share = 1
residency = "on_demand"

# `weights_bytes` is the size of the weight arena of the engine. The engine knows it only after the weights load, and
# the plan reads no weights (spec 2.4). The value below is the size of the UD-IQ4_XS shards. After a change to the
# engine or its weights, a start exits 3 with the new size. Write that size here and in the copy in the store
# directory (docs/deploy.md, "The weights size").
[engines.config]
weights_bytes = 65490227200

# Qwen-Image 2.1 with the FUSAL LoRA (docs/spec.md 11.9c): the served image model `qwen-image-fusal`. It is the
# resident engine. Before a large build on the machine, unload it with the load routes (spec 3.3b), or stop the
# nagaya. The config names each file of the variant; the code names none. The plan reads the headers: 29,873,193,256
# bytes of bf16 weights (the text tower, the transformer and the VAE decoder) and 7 GiB of scratch, measured
# (`examples/measure.rs`, docs/deploy.md "The memory budgets"). The plan table of its GEMMs is a file in the store
# directory (spec 12.1).
[[engines]]
name = "qwen-image-fusal"
kind = "qwenimage21"
devices = [0]
share = 1

[engines.config]
model = "/srv/models/qwen-image-2.1/Qwen-Image-2.1"
encoder = "/srv/models/qwen-image-2.1/Qwen-Image-2.1-Anime-Fusal/text_encoders/qwen3-vl-8b-heretic-1.3.0_bf16.safetensors"
lora = "/srv/models/qwen-image-2.1/Qwen-Image-2.1-Anime-Fusal/loras/fusal-qwen-image-2.1-style-hires-exact-r56.safetensors"
plan_dir = "/srv/nagaya/store"

# One pool for device(0) and host (spec 4.1): the unified memory.
# 112 GiB = 120,259,084,288 bytes. The host has 131,156,408 kB (about 125.1 GiB, `proc/meminfo`), and the safety
# floor of spec 4.7 is 12 GiB. That leaves 113.1 GiB. The pool takes 112 GiB: a whole count of GiB, a little less.
[[budgets]]
tiers = ["device(0)", "host"]
bytes = 120259084288

# The store (spec 4.1a): 2 GiB in host memory and 50 GiB on NVMe. The host budget takes its bytes from the pool
# above, and docs/deploy.md "The memory budgets" gives the sum. Objects have their own budget of 200 GiB on the same
# disk (spec 6.15).
[store]
nvme = 53687091200
host = 2147483648
interval_copies = 0
objects = 214748364800
