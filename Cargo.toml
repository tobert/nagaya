[workspace]
members = [
    "crates/nagaya-abi",
    "crates/nagaya-store",
    "crates/nagaya-ledger",
    "crates/nagaya-sched",
    "crates/nagaya-mk-qwen38-gfx1151",
    "crates/nagaya-mk-hip",
    "crates/nagaya-mk-qwenimage21-gfx1151",
    "crates/nagaya-mk-bmg",
    "crates/nagaya-mk-gemma4-bmg",
    "crates/nagaya-mk-qwen3tts-bmg",
    "crates/nagaya-mk-sdxl-bmg",
    "crates/nagaya-mk-embeddinggemma2-bmg",
    "crates/nagaya-mk-lfm3-bmg",
    "crates/nagaya-mk-inkling2-bmg",
    "crates/nagaya-mk-cuda",
    "crates/nagaya-mk-inkling2-sm121",
    "crates/nagaya-jinja",
    "crates/nagaya-family-qwen38",
    "crates/nagaya-family-gemma4",
    "crates/nagaya-family-qwen3tts",
    "crates/nagaya-family-sdxl",
    "crates/nagaya-family-embeddinggemma2",
    "crates/nagaya-family-qwenimage21",
    "crates/nagaya-family-lfm3",
    "crates/nagaya-family-inkling2",
    "crates/nagaya-family-beatthis",
    "crates/nagaya-mk-beatthis-cpu",
    "crates/nagaya-mk-beatthis-gfx1151",
    "crates/nagaya-council",
    "crates/nagaya-family-toy",
    "crates/nagaya-telemetry",
    "crates/nagaya-conformance",
    "crates/nagaya",
]
resolver = "3"

# gogi is the contract of council v2 (github.com/tobert/gogi). The pin is a commit of its `main`, so a build gives the
# same code at each fetch. Move the pin when gogi changes the contract.
[workspace.dependencies]
gogi-proto = { git = "https://github.com/tobert/gogi", rev = "7d789e50885fd28c79b0abfa7acdccfba840b679" }
gogi-fake = { git = "https://github.com/tobert/gogi", rev = "7d789e50885fd28c79b0abfa7acdccfba840b679" }
gogi-toy = { git = "https://github.com/tobert/gogi", rev = "7d789e50885fd28c79b0abfa7acdccfba840b679" }
gogi-conformance = { git = "https://github.com/tobert/gogi", rev = "7d789e50885fd28c79b0abfa7acdccfba840b679" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The host form of Inkling 2 runs the whole model on the CPU in its tests. With no optimization a prompt takes hours.
[profile.dev.package.nagaya-mk-inkling2-bmg]
opt-level = 3

[profile.dev.package.nagaya-mk-inkling2-sm121]
opt-level = 3

# The CPU interpreter of Beat This! runs whole chunks of the model in its tests: about 130 GFLOP for 30 s of final0.
[profile.dev.package.nagaya-mk-beatthis-cpu]
opt-level = 3

[profile.dev.package.libm]
opt-level = 3

# The CUDA interpreter repacks the weights on the host at each load. With no optimization a GPU test binary waits
# on the CPU while the GPU idles.
[profile.dev.package.nagaya-mk-cuda]
opt-level = 3
