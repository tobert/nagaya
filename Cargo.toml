[workspace]
members = [
    "crates/nagaya-abi",
    "crates/nagaya-store",
    "crates/nagaya-ledger",
    "crates/nagaya-sched",
    "crates/nagaya-mk-qwen38-gfx1151",
    "crates/nagaya-mk-hip",
    "crates/nagaya-mk-qwenimage21-gfx1151",
    "crates/nagaya-mk-bmg",
    "crates/nagaya-mk-gemma4-bmg",
    "crates/nagaya-mk-qwen3tts-bmg",
    "crates/nagaya-mk-sdxl-bmg",
    "crates/nagaya-mk-embeddinggemma2-bmg",
    "crates/nagaya-mk-lfm3-bmg",
    "crates/nagaya-jinja",
    "crates/nagaya-text-qwen38",
    "crates/nagaya-text-gemma4",
    "crates/nagaya-text-qwen3tts",
    "crates/nagaya-text-sdxl",
    "crates/nagaya-text-embeddinggemma2",
    "crates/nagaya-text-qwenimage21",
    "crates/nagaya-text-lfm3",
    "crates/nagaya-council",
    "crates/nagaya-text-toy",
    "crates/nagaya-telemetry",
    "crates/nagaya-conformance",
    "crates/nagaya",
]
resolver = "3"

# gogi is the contract of council v2 (github.com/tobert/gogi). The pin is a commit of its `main`, so a build gives the
# same code at each fetch. Move the pin when gogi changes the contract.
[workspace.dependencies]
gogi-proto = { git = "https://github.com/tobert/gogi", rev = "8830357260086202c76feda1ccce672d70921140" }
gogi-fake = { git = "https://github.com/tobert/gogi", rev = "8830357260086202c76feda1ccce672d70921140" }
gogi-toy = { git = "https://github.com/tobert/gogi", rev = "8830357260086202c76feda1ccce672d70921140" }
gogi-conformance = { git = "https://github.com/tobert/gogi", rev = "8830357260086202c76feda1ccce672d70921140" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
